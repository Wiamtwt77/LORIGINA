<!-- بالون "مستشار" الذكي الطافٍ -->
<button class="ai-floating-balloon" onclick="toggleAIChat()" title="مستشار - مساعدك الذكي">
    <span class="balloon-icon">🎈</span>
    <span class="balloon-text">مستشار</span>
</button>

<!-- نافذة الدردشة -->
<div id="aiChatModal" class="ai-chat-modal">
    <div class="ai-chat-header">
        <div class="ai-chat-title">
            <span class="ai-status-dot"></span>
            <span>مستشار — Lorigina</span>
        </div>
        <button class="ai-close-btn" onclick="toggleAIChat()">×</button>
    </div>
    <div id="aiChatMessages" class="ai-chat-messages">
        <div class="ai-msg ai-bot">أهلاً بكِ! أنا "مستشار"، مساعدك الذكي في Lorigina. كيف يمكنني إلهام مشروعك الحرفي اليوم؟ ✨</div>
    </div>
    <div class="ai-chat-input-area">
        <input type="text" id="aiUserInput" placeholder="اكتبي استفسارك هنا..." onkeypress="handleAIPress(event)">
        <button onclick="sendAIMessage()">إرسال</button>
    </div>
</div>

<style>
/* تصميم البالون الذكي الطافٍ */
.ai-floating-balloon {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background-color: var(--dark-pink);
    color: #fff;
    border: none;
    padding: 10px 18px;
    border-radius: 35px 35px 35px 6px; /* شكل يشبه البالون مع ذيل ناعم للأسفل */
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    box-shadow: 0 8px 25px rgba(143, 58, 82, 0.35);
    z-index: 999;
    animation: floatBalloon 3s ease-in-out infinite;
    transition: background-color 0.2s, transform 0.2s;
}

@keyframes floatBalloon {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }
    50% {
        transform: translateY(-10px) rotate(1.5deg);
    }
}

.ai-floating-balloon:hover {
    background-color: var(--dark-pink-hover);
    animation-play-state: paused;
    transform: scale(1.06);
}

.balloon-icon {
    font-size: 1.1rem;
}

/* نافذة الدردشة */
.ai-chat-modal {
    position: fixed;
    bottom: 95px;
    right: 30px;
    width: 350px;
    height: 450px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(17, 17, 17, 0.1);
    display: flex;
    flex-direction: column;
    z-index: 1000;
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}

.ai-chat-modal.active {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.ai-chat-header {
    padding: 12px 16px;
    background-color: var(--bg-main);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
}

.ai-chat-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text-dark);
}

.ai-status-dot {
    width: 8px;
    height: 8px;
    background-color: #4CAF50;
    border-radius: 50%;
}

.ai-close-btn {
    background: none;
    border: none;
    font-size: 1.2rem;
    cursor: pointer;
    color: var(--text-muted);
}

.ai-chat-messages {
    flex-grow: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.88rem;
}

.ai-msg {
    padding: 10px 14px;
    border-radius: 8px;
    max-width: 85%;
    line-height: 1.5;
}

.ai-bot {
    background-color: var(--bg-main);
    color: var(--text-dark);
    align-self: flex-start;
    border-bottom-right-radius: 2px;
}

.ai-user {
    background-color: var(--dark-pink);
    color: #fff;
    align-self: flex-end;
    border-bottom-left-radius: 2px;
}

.ai-chat-input-area {
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    background: var(--bg-card);
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
}

.ai-chat-input-area input {
    flex-grow: 1;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.85rem;
    outline: none;
    background: var(--bg-main);
    color: var(--text-dark);
}

.ai-chat-input-area input:focus {
    border-color: var(--dark-pink);
}

.ai-chat-input-area button {
    background-color: var(--dark-pink);
    color: #fff;
    border: none;
    padding: 0 14px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.85rem;
    transition: background-color 0.2s;
}

.ai-chat-input-area button:hover {
    background-color: var(--dark-pink-hover);
}
</style>

<script>
function toggleAIChat() {
    const modal = document.getElementById('aiChatModal');
    modal.classList.toggle('active');
}

function handleAIPress(e) {
    if (e.key === 'Enter') {
        sendAIMessage();
    }
}

async function sendAIMessage() {
    const input = document.getElementById('aiUserInput');
    const text = input.value.trim();
    if (!text) return;

    const messagesContainer = document.getElementById('aiChatMessages');
    
    messagesContainer.innerHTML += `<div class="ai-msg ai-user">${escapeHtml(text)}</div>`;
    input.value = '';
    messagesContainer.scrollTop = messagesContainer.scrollHeight;

    const loadingId = 'loading-' + Date.now();
    messagesContainer.innerHTML += `<div id="${loadingId}" class="ai-msg ai-bot" style="color: var(--text-muted);">جاري التفكير...</div>`;
    messagesContainer.scrollTop = messagesContainer.scrollHeight;

    try {
        const response = await fetch('/api/app', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
        });
        
        const data = await response.json();
        document.getElementById(loadingId).remove();
        
        if (data.reply) {
            messagesContainer.innerHTML += `<div class="ai-msg ai-bot">${escapeHtml(data.reply)}</div>`;
        } else {
            messagesContainer.innerHTML += `<div class="ai-msg ai-bot">عذراً، حدث خطأ في الرد.</div>`;
        }
    } catch (err) {
        document.getElementById(loadingId).remove();
        messagesContainer.innerHTML += `<div class="ai-msg ai-bot">تعذر الاتصال بالمساعد حالياً.</div>`;
    }
    messagesContainer.scrollTop = messagesContainer.scrollHeight;
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
</script>
